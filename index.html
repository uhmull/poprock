<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #bfdbfe;
    --sky-mid: #93c5fd;
    --blue: #3b82f6;
    --blue-deep: #2563eb;
    --navy: #1e3a5f;
    --navy-dark: #0f2340;
    --frost: #eff6ff;
    --mist: #dbeafe;
    --periwinkle: #818cf8;
    --blush: #e0e7ff;
    --cream: #f0f7ff;
    --text: #1e3a5f;
    --text-soft: #4b7ab5;
    --text-muted: #7aa2cc;
    --high: #ef4444;
    --high-bg: #fff0f0;
    --med: #f59e0b;
    --med-bg: #fffbeb;
    --low: #22c55e;
    --low-bg: #f0fdf4;
    --card-bg: rgba(255,255,255,0.72);
    --border: rgba(147,197,253,0.35);
    --shadow: 0 4px 24px rgba(59,130,246,0.10);
    --shadow-hover: 0 8px 32px rgba(59,130,246,0.18);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: linear-gradient(135deg, #e0f0ff 0%, #c7e0ff 40%, #d4e8ff 70%, #e8f3ff 100%);
    min-height: 100vh;
    color: var(--text);
    padding: 28px 20px 60px;
    position: relative;
    overflow-x: hidden;
  }

  /* Floating blobs */
  body::before {
    content: '';
    position: fixed; top: -120px; right: -80px;
    width: 420px; height: 420px;
    background: radial-gradient(circle, rgba(147,197,253,0.45) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none; z-index: 0;
    animation: floatBlob 8s ease-in-out infinite;
  }
  body::after {
    content: '';
    position: fixed; bottom: -100px; left: -60px;
    width: 360px; height: 360px;
    background: radial-gradient(circle, rgba(129,140,248,0.3) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none; z-index: 0;
    animation: floatBlob 10s ease-in-out infinite reverse;
  }
  @keyframes floatBlob {
    0%,100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(20px) scale(1.05); }
  }

  .container { max-width: 1300px; margin: 0 auto; position: relative; z-index: 1; }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 36px;
    animation: fadeDown 0.6s ease both;
  }
  @keyframes fadeDown { from { opacity:0; transform:translateY(-16px);} to { opacity:1; transform:none;} }

  .header h1 {
    font-family: 'Fraunces', serif;
    font-size: 2.8rem;
    font-weight: 300;
    font-style: italic;
    color: var(--navy);
    letter-spacing: -0.5px;
    line-height: 1;
  }
  .header h1 span {
    background: linear-gradient(120deg, var(--blue), var(--periwinkle));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header-sub {
    font-size: 0.88rem;
    color: var(--text-muted);
    margin-top: 6px;
    font-weight: 300;
    letter-spacing: 0.04em;
  }

  /* Floating sparkle deco */
  .deco { position: absolute; pointer-events: none; }

  /* Cards */
  .card {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    border-radius: 20px;
    padding: 24px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    transition: box-shadow 0.2s;
    animation: fadeUp 0.5s ease both;
  }
  @keyframes fadeUp { from { opacity:0; transform:translateY(14px);} to { opacity:1; transform:none;} }
  .card:hover { box-shadow: var(--shadow-hover); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }

  .section-label {
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--border), transparent);
  }

  /* Form elements */
  .input-group { margin-bottom: 12px; }
  label {
    display: block;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--text-soft);
    margin-bottom: 5px;
    letter-spacing: 0.02em;
  }

  input[type="text"], input[type="number"], input[type="date"], select {
    width: 100%;
    padding: 10px 14px;
    background: rgba(255,255,255,0.8);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    outline: none;
  }
  input:focus, select:focus {
    border-color: var(--sky-mid);
    background: white;
    box-shadow: 0 0 0 3px rgba(147,197,253,0.25);
  }
  input::placeholder { color: var(--text-muted); }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .btn {
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.01em;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--blue) 0%, var(--blue-deep) 100%);
    color: white;
    box-shadow: 0 3px 12px rgba(59,130,246,0.3);
    width: 100%;
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 5px 18px rgba(59,130,246,0.4);
  }
  .btn-sm {
    padding: 5px 12px;
    font-size: 0.8rem;
    background: var(--mist);
    color: var(--text-soft);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .btn-sm:hover { background: var(--sky); }
  .btn-delete {
    background: #fff0f0;
    color: #ef4444;
    border: 1px solid rgba(239,68,68,0.2);
    border-radius: 8px;
    padding: 5px 12px;
    font-size: 0.8rem;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    transition: all 0.2s;
  }
  .btn-delete:hover { background: #fee2e2; }

  /* Today section */
  .today-card {
    background: linear-gradient(135deg, rgba(219,234,254,0.9) 0%, rgba(224,231,255,0.85) 100%);
    border: 1px solid rgba(147,197,253,0.5);
    margin-bottom: 18px;
    animation-delay: 0.1s;
  }
  .today-date {
    font-family: 'Fraunces', serif;
    font-size: 1.1rem;
    font-style: italic;
    color: var(--blue-deep);
    margin-left: 4px;
  }

  /* Task items */
  .task-item {
    background: rgba(255,255,255,0.75);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .task-item::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, var(--blue), var(--periwinkle));
    border-radius: 3px 0 0 3px;
  }
  .task-item.high-border::before { background: linear-gradient(180deg, #ef4444, #f97316); }
  .task-item.low-border::before { background: linear-gradient(180deg, #22c55e, #16a34a); }
  .task-item:hover { transform: translateX(2px); box-shadow: var(--shadow-hover); }
  .task-item.completed { opacity: 0.5; }
  .task-item.completed .task-title { text-decoration: line-through; }

  .task-header { display: flex; align-items: flex-start; gap: 12px; }

  /* Custom checkbox */
  .custom-check {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 2px solid var(--sky-mid);
    flex-shrink: 0;
    margin-top: 3px;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    background: white;
    transition: all 0.2s;
    position: relative;
  }
  .custom-check:checked {
    background: linear-gradient(135deg, var(--blue), var(--periwinkle));
    border-color: var(--blue);
  }
  .custom-check:checked::after {
    content: '✓';
    position: absolute;
    font-size: 10px;
    color: white;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    font-weight: bold;
  }

  .task-content { flex: 1; min-width: 0; }
  .task-title { font-size: 0.97rem; font-weight: 500; margin-bottom: 7px; color: var(--text); }

  .task-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }

  .pill {
    padding: 3px 9px;
    border-radius: 20px;
    font-size: 0.73rem;
    font-weight: 500;
    letter-spacing: 0.01em;
  }
  .pill-subject { background: var(--blush); color: var(--periwinkle); }
  .pill-hours { background: var(--mist); color: var(--blue); }
  .pill-due { background: rgba(255,255,255,0.9); color: var(--text-soft); border: 1px solid var(--border); }
  .pill-high { background: var(--high-bg); color: var(--high); }
  .pill-med { background: var(--med-bg); color: #d97706; }
  .pill-low { background: var(--low-bg); color: #16a34a; }

  .task-actions { display: flex; gap: 6px; margin-top: 8px; }

  /* Subtasks */
  .subtasks { padding-left: 30px; margin-top: 8px; }
  .subtask-item {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 0;
    font-size: 0.83rem;
    color: var(--text-soft);
    border-bottom: 1px dashed rgba(147,197,253,0.2);
  }
  .subtask-item:last-child { border-bottom: none; }
  .subtask-check {
    width: 14px; height: 14px;
    border-radius: 3px;
    border: 1.5px solid var(--sky-mid);
    appearance: none; -webkit-appearance: none;
    background: white;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
    position: relative;
  }
  .subtask-check:checked { background: var(--blue); border-color: var(--blue); }
  .subtask-check:checked::after {
    content: '✓';
    position: absolute;
    font-size: 9px; color: white;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    font-weight: bold;
  }

  .subtask-form {
    display: none;
    margin-top: 10px;
    padding: 12px;
    background: rgba(219,234,254,0.4);
    border-radius: 10px;
    border: 1px dashed var(--border);
  }
  .subtask-form.show { display: block; }
  .subtask-form-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 8px; }
  .subtask-form-row input { margin: 0; }
  .subtask-form-btns { display: flex; gap: 6px; }

  /* Date items */
  .date-item {
    background: rgba(255,255,255,0.7);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.2s;
  }
  .date-item:hover { transform: translateX(2px); background: white; }
  .date-title { font-size: 0.93rem; font-weight: 500; margin-bottom: 3px; }
  .date-meta { font-size: 0.78rem; color: var(--text-muted); }

  .pill-test { background: #ede9fe; color: #7c3aed; }
  .pill-deadline { background: #fce7f3; color: #db2777; }
  .pill-event { background: var(--mist); color: var(--blue); }

  /* Filters */
  .filters { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-btn {
    padding: 6px 14px;
    font-size: 0.8rem;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: rgba(255,255,255,0.6);
    color: var(--text-soft);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    transition: all 0.2s;
  }
  .filter-btn:hover { background: var(--mist); }
  .filter-btn.active {
    background: linear-gradient(135deg, var(--blue), var(--blue-deep));
    color: white;
    border-color: transparent;
    box-shadow: 0 2px 10px rgba(59,130,246,0.3);
  }

  .empty-state {
    text-align: center;
    padding: 28px;
    color: var(--text-muted);
    font-size: 0.88rem;
  }
  .empty-state .emoji { font-size: 2rem; display: block; margin-bottom: 8px; }

  @media (max-width: 700px) {
    .grid { grid-template-columns: 1fr; }
    .two-col { grid-template-columns: 1fr; }
    .header h1 { font-size: 2rem; }
  }
</style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <div class="header">
    <h1><span>task</span> manager ✦</h1>
    <div class="header-sub" id="headerDate">loading date…</div>
  </div>

  <!-- Top grid: Add Task + Add Date -->
  <div class="grid">
    <div class="card" style="animation-delay:0.05s">
      <div class="section-label">✦ new task</div>
      <form id="taskForm">
        <div class="input-group">
          <label>Task Name</label>
          <input type="text" id="taskName" required placeholder="what needs doing?">
        </div>
        <div class="two-col">
          <div class="input-group">
            <label>Subject / Category</label>
            <input type="text" id="taskSubject" placeholder="AP Psych, APPC…">
          </div>
          <div class="input-group">
            <label>Priority</label>
            <select id="taskPriority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>
        <div class="two-col">
          <div class="input-group">
            <label>Estimated Hours</label>
            <input type="number" id="taskHours" step="0.5" min="0" placeholder="2">
          </div>
          <div class="input-group">
            <label>Deadline</label>
            <input type="date" id="taskDeadline">
          </div>
        </div>
        <button type="submit" class="btn btn-primary">+ add task</button>
      </form>
    </div>

    <div class="card" style="animation-delay:0.1s">
      <div class="section-label">✦ important date</div>
      <form id="dateForm">
        <div class="input-group">
          <label>Event Name</label>
          <input type="text" id="dateName" required placeholder="AP Gov unit test…">
        </div>
        <div class="two-col">
          <div class="input-group">
            <label>Type</label>
            <select id="dateType">
              <option value="Test">Test</option>
              <option value="Deadline">Deadline</option>
              <option value="Event">Event</option>
            </select>
          </div>
          <div class="input-group">
            <label>Date</label>
            <input type="date" id="dateDate" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">+ add date</button>
      </form>
    </div>
  </div>

  <!-- Today -->
  <div class="card today-card" style="animation-delay:0.15s; margin-bottom:18px;">
    <div class="section-label">🌤 today — <span class="today-date" id="todayDate"></span></div>
    <div id="todayTasks"></div>
  </div>

  <!-- All Tasks -->
  <div class="card" style="animation-delay:0.2s; margin-bottom:18px;">
    <div class="section-label">✦ all tasks</div>
    <div class="filters">
      <button class="filter-btn active" onclick="filterTasks('all', this)">all</button>
      <button class="filter-btn" onclick="filterTasks('active', this)">active</button>
      <button class="filter-btn" onclick="filterTasks('completed', this)">completed</button>
    </div>
    <div id="taskList"></div>
  </div>

  <!-- Important Dates -->
  <div class="card" style="animation-delay:0.25s;">
    <div class="section-label">📅 important dates & tests</div>
    <div id="dateList"></div>
  </div>

</div>

<script>
let tasks = [], dates = [], currentFilter = 'all';

const initialTasks = [
  { name:"FRQ 2", subject:"APPC", priority:"high", hours:1, deadline:"2026-05-06", completed:false, subtasks:[] },
  { name:"FRQ 3", subject:"APPC", priority:"high", hours:1, deadline:"2026-05-06", completed:false, subtasks:[] },
  { name:"Psych Unit 5 notes", subject:"AP Psych", priority:"high", hours:2, deadline:"2026-05-06", completed:false, subtasks:[] },
  { name:"FRQ 4", subject:"APPC", priority:"medium", hours:1.5, deadline:"2026-05-07", completed:false, subtasks:[] },
  { name:"Read Great Gatsby", subject:"AP Lang", priority:"medium", hours:4, deadline:"2026-05-13", completed:false, subtasks:[] },
  { name:"AP Lang study guide", subject:"Lang", priority:"medium", hours:1, deadline:"2026-05-08", completed:false, subtasks:[] },
  { name:"FRQ post", subject:"FRC", priority:"medium", hours:2, deadline:"2026-05-08", completed:false, subtasks:[] },
  { name:"AP Psych Study Guides", subject:"AP Psych", priority:"medium", hours:2.5, deadline:"2026-05-09", completed:false, subtasks:[] },
  { name:"APPC Study Guides", subject:"APPC", priority:"medium", hours:3, deadline:"2026-05-09", completed:false, subtasks:[] },
  { name:"Study for AP Psych Exam", subject:"AP Psych", priority:"medium", hours:5, deadline:"2026-05-11", completed:false, subtasks:[] },
  { name:"Study for APPC", subject:"APPC", priority:"medium", hours:5, deadline:"2026-05-11", completed:false, subtasks:[] },
  { name:"Unit 4 Quiz cards", subject:"AP Psych", priority:"medium", hours:1, deadline:"2026-05-06", completed:false, subtasks:[] },
  { name:"Unit 2 Quiz cards", subject:"AP Psych", priority:"medium", hours:1.5, deadline:"2026-05-06", completed:false, subtasks:[] },
  { name:"Finish Portfolio", subject:"APD", priority:"medium", hours:1.5, deadline:"2026-05-06", completed:false, subtasks:[] },
  { name:"History hw", subject:"USH", priority:"low", hours:0.5, deadline:"2026-05-06", completed:false, subtasks:[] }
];

const initialDates = [
  { name:"APD portfolio due", type:"Deadline", date:"2026-05-07" },
  { name:"AP Psych AP Exam", type:"Test", date:"2026-05-12" },
  { name:"APPC AP Exam", type:"Test", date:"2026-05-12" },
  { name:"AP Lang AP Test", type:"Test", date:"2026-05-13" }
];

try { tasks = JSON.parse(localStorage.getItem('tasks_v2')) || initialTasks; } catch(e) { tasks = initialTasks; }
try { dates = JSON.parse(localStorage.getItem('dates_v2')) || initialDates; } catch(e) { dates = initialDates; }

function save() {
  try { localStorage.setItem('tasks_v2', JSON.stringify(tasks)); } catch(e){}
  try { localStorage.setItem('dates_v2', JSON.stringify(dates)); } catch(e){}
}

function getTodayStr() { return new Date().toISOString().split('T')[0]; }
function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}

const priorityOrder = { high:0, medium:1, low:2 };
function sortedTasks(arr) {
  return [...arr].sort((a,b) => {
    if (priorityOrder[a.priority] !== priorityOrder[b.priority]) return priorityOrder[a.priority] - priorityOrder[b.priority];
    return new Date(a.deadline) - new Date(b.deadline);
  });
}

function priorityPill(p) {
  if (p==='high') return `<span class="pill pill-high">↑ high</span>`;
  if (p==='low') return `<span class="pill pill-low">↓ low</span>`;
  return `<span class="pill pill-med">~ med</span>`;
}

function taskHTML(task, realIdx) {
  const borderClass = task.priority==='high' ? 'high-border' : task.priority==='low' ? 'low-border' : '';
  const subtasksHTML = (task.subtasks||[]).length > 0
    ? `<div class="subtasks">${task.subtasks.map((st,si) => `
        <div class="subtask-item">
          <input type="checkbox" class="subtask-check" ${st.completed?'checked':''} onchange="toggleSubtask(${realIdx},${si})">
          <span style="${st.completed?'text-decoration:line-through;opacity:0.6;':''}">${st.name}${st.hours?' · '+st.hours+'h':''}</span>
        </div>`).join('')}
      </div>` : '';

  return `<div class="task-item ${borderClass} ${task.completed?'completed':''}">
    <div class="task-header">
      <input type="checkbox" class="custom-check" ${task.completed?'checked':''} onchange="toggleTask(${realIdx})">
      <div class="task-content">
        <div class="task-title">${task.name}</div>
        <div class="task-meta">
          ${task.subject ? `<span class="pill pill-subject">${task.subject}</span>` : ''}
          ${priorityPill(task.priority)}
          ${task.hours ? `<span class="pill pill-hours">${task.hours}h</span>` : ''}
          ${task.deadline ? `<span class="pill pill-due">due ${fmtDate(task.deadline)}</span>` : ''}
        </div>
        ${subtasksHTML}
        <div class="task-actions">
          <button class="btn btn-sm" onclick="showSubtaskForm(${realIdx})">+ subtask</button>
          <button class="btn-delete" onclick="deleteTask(${realIdx})">remove</button>
        </div>
        <div id="stf${realIdx}" class="subtask-form">
          <div class="subtask-form-row">
            <input type="text" id="stn${realIdx}" placeholder="subtask name">
            <input type="number" id="sth${realIdx}" placeholder="hrs" step="0.5" min="0" style="width:70px;">
          </div>
          <div class="subtask-form-btns">
            <button class="btn btn-primary" style="width:auto;padding:7px 14px;" onclick="addSubtask(${realIdx})">add</button>
            <button class="btn btn-sm" onclick="hideSubtaskForm(${realIdx})">cancel</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function renderTasks() {
  const todayStr = getTodayStr();
  document.getElementById('todayDate').textContent = fmtDate(todayStr);
  document.getElementById('headerDate').textContent = new Date().toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'});

  let filtered = tasks;
  if (currentFilter==='active') filtered = tasks.filter(t=>!t.completed);
  else if (currentFilter==='completed') filtered = tasks.filter(t=>t.completed);

  const sorted = sortedTasks(filtered);

  // Today
  const todayArr = sortedTasks(tasks.filter(t => t.deadline===todayStr && !t.completed));
  const todayEl = document.getElementById('todayTasks');
  if (todayArr.length===0) {
    todayEl.innerHTML = `<div class="empty-state"><span class="emoji">🌸</span>no tasks due today!</div>`;
  } else {
    todayEl.innerHTML = todayArr.map(t => {
      const ri = tasks.indexOf(t);
      return taskHTML(t, ri);
    }).join('');
  }

  // All
  const listEl = document.getElementById('taskList');
  if (sorted.length===0) {
    listEl.innerHTML = `<div class="empty-state"><span class="emoji">✨</span>nothing here yet</div>`;
  } else {
    listEl.innerHTML = sorted.map(t => {
      const ri = tasks.indexOf(t);
      return taskHTML(t, ri);
    }).join('');
  }
}

function renderDates() {
  const sorted = [...dates].sort((a,b) => new Date(a.date)-new Date(b.date));
  const el = document.getElementById('dateList');
  if (sorted.length===0) {
    el.innerHTML = `<div class="empty-state"><span class="emoji">📅</span>no dates yet</div>`;
    return;
  }
  el.innerHTML = sorted.map((d,i) => {
    const ri = dates.indexOf(d);
    const typeClass = d.type==='Test'?'pill-test':d.type==='Deadline'?'pill-deadline':'pill-event';
    return `<div class="date-item">
      <div>
        <div class="date-title">${d.name}</div>
        <div class="date-meta"><span class="pill ${typeClass}" style="font-size:0.72rem;">${d.type}</span> &nbsp;${fmtDate(d.date)}</div>
      </div>
      <button class="btn-delete" onclick="deleteDate(${ri})">remove</button>
    </div>`;
  }).join('');
}

function toggleTask(i) { tasks[i].completed=!tasks[i].completed; save(); renderTasks(); }
function toggleSubtask(ti,si) { tasks[ti].subtasks[si].completed=!tasks[ti].subtasks[si].completed; save(); renderTasks(); }
function deleteTask(i) { tasks.splice(i,1); save(); renderTasks(); }
function deleteDate(i) { dates.splice(i,1); save(); renderDates(); }
function showSubtaskForm(i) { document.getElementById('stf'+i)?.classList.add('show'); }
function hideSubtaskForm(i) { document.getElementById('stf'+i)?.classList.remove('show'); }
function addSubtask(i) {
  const n = document.getElementById('stn'+i)?.value;
  const h = parseFloat(document.getElementById('sth'+i)?.value)||0;
  if (!n) return;
  if (!tasks[i].subtasks) tasks[i].subtasks=[];
  tasks[i].subtasks.push({ name:n, hours:h, completed:false });
  save(); renderTasks();
}
function filterTasks(f, btn) {
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderTasks();
}

document.getElementById('taskForm').addEventListener('submit', e => {
  e.preventDefault();
  tasks.push({
    name: document.getElementById('taskName').value,
    subject: document.getElementById('taskSubject').value,
    priority: document.getElementById('taskPriority').value,
    hours: parseFloat(document.getElementById('taskHours').value)||0,
    deadline: document.getElementById('taskDeadline').value,
    completed: false, subtasks: []
  });
  save(); renderTasks(); e.target.reset();
});

document.getElementById('dateForm').addEventListener('submit', e => {
  e.preventDefault();
  dates.push({
    name: document.getElementById('dateName').value,
    type: document.getElementById('dateType').value,
    date: document.getElementById('dateDate').value
  });
  save(); renderDates(); e.target.reset();
});

renderTasks();
renderDates();
</script>
</body>
</html>
